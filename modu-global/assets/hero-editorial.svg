<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 760" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a2b44"/><stop offset=".42" stop-color="#657083"/><stop offset=".76" stop-color="#c2c4c4"/><stop offset="1" stop-color="#e7dfd2"/></linearGradient>
  <linearGradient id="alcove" x1="0" y1="0" x2="1" y2=".2"><stop offset="0" stop-color="#5c6b7c"/><stop offset=".68" stop-color="#c7c9c8"/><stop offset="1" stop-color="#eee7db"/></linearGradient>
  <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6e2d8"/><stop offset=".53" stop-color="#b4b8b8"/><stop offset="1" stop-color="#8d9ba5"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1b2d43"/><stop offset=".27" stop-color="#61738a"/><stop offset=".65" stop-color="#2b415a"/><stop offset="1" stop-color="#172a42"/></linearGradient>
  <linearGradient id="milky" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a8afb2"/><stop offset=".24" stop-color="#e9e8e3"/><stop offset=".66" stop-color="#fffefa"/><stop offset="1" stop-color="#bfc4c4"/></linearGradient>
  <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f0e8"/><stop offset=".42" stop-color="#9ba6b1"/><stop offset=".78" stop-color="#eef1ed"/><stop offset="1" stop-color="#7a8797"/></linearGradient>
  <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#beaa8e"/><stop offset=".5" stop-color="#eee0c6"/><stop offset="1" stop-color="#b7a58b"/></linearGradient>
  <radialGradient id="lit"><stop offset="0" stop-color="#fffdf6" stop-opacity=".69"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="21"/></filter>
  <filter id="smallShadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".28" numOctaves="3" seed="8" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".034"/></feComponentTransfer></filter>
</defs>
